<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuevo Producto</title>
</head>
<body>
    <h1>Agregar Producto</h1>
    <form action="/productos/guardar" method="post" th:object="${producto}">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required /><br><br>
        
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" required /><br><br>
        
        <label>Categoría:</label>
        <input type="text" th:field="*{categoria}" required /><br><br>
        
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
